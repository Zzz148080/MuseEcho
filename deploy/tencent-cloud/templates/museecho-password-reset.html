<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuseEcho 重置密码</title>
</head>
<body style="margin:0;padding:0;background:#eef3ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif;color:#24324a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#eef3ff;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background:#ffffff;border:1px solid #dce5fb;border-radius:20px;overflow:hidden;">
          <tr>
            <td style="padding:28px 32px;background:linear-gradient(135deg,#4b6cb7 0%,#6d5bd0 100%);color:#ffffff;">
              <div style="font-size:13px;letter-spacing:3px;font-weight:700;">MUSEECHO · USER MEMORY</div>
              <div style="margin-top:18px;font-size:28px;line-height:1.3;font-weight:700;">找回账号密码</div>
            </td>
          </tr>
          <tr>
            <td style="padding:34px 32px 12px;font-size:16px;line-height:1.8;">
              <p style="margin:0 0 18px;">您好，我们收到了重置 MuseEcho 账号密码的请求。</p>
              <p style="margin:0 0 24px;">如果这是你的操作，请点击下面的按钮设置新密码。</p>
              <p style="margin:0 0 28px;text-align:center;">
                <a href="https://museecho.toolgate.cloud/#reset={{reset_token}}" style="display:inline-block;padding:14px 28px;border-radius:10px;background:#536fb5;color:#ffffff;text-decoration:none;font-weight:700;">重置密码</a>
              </p>
              <p style="margin:0 0 10px;color:#63708a;font-size:14px;">链接有效期：{{expire_minutes}} 分钟。</p>
              <p style="margin:0;color:#63708a;font-size:14px;">如果这不是你的操作，请忽略本邮件，并检查账号安全。</p>
            </td>
          </tr>
          <tr>
            <td style="padding:22px 32px 30px;color:#8994aa;font-size:12px;line-height:1.6;">
              MuseEcho · 发现声音，收藏灵感
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
