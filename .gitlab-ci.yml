stages:
  - lint
  - test
  - build
  - security

variables:
  UV_VERSION: "0.11.29"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

.python-job:
  image: python:3.12.13-bookworm
  before_script:
    - apt-get update && apt-get install --yes ffmpeg
    - python -m pip install "uv==$UV_VERSION"
    - uv sync --frozen --extra dev
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths:
      - .uv-cache/

lint:
  extends: .python-job
  stage: lint
  script:
    - uv lock --check
    - uv run ruff format --check src tests
    - uv run ruff check .
    - uv run mypy src
    - uv run python scripts/license_audit.py

unit-test:
  extends: .python-job
  stage: test
  script:
    - uv run pytest -q --basetemp tmp/pytest-ci

frontend:
  image: node:22.23.0-bookworm-slim
  stage: test
  script:
    - npm ci
    - npm run typecheck
    - npm audit --audit-level=high
    - npm --prefix frontend ci
    - npm --prefix frontend test
    - npm --prefix frontend run typecheck
    - npm --prefix frontend run build
    - npm --prefix frontend audit --audit-level=high

e2e:
  image: mcr.microsoft.com/playwright:v1.61.1-noble
  stage: test
  script:
    - apt-get update && apt-get install --yes python3 python3-venv ffmpeg
    - python3 -m venv .ci-tools
    - .ci-tools/bin/pip install "uv==$UV_VERSION"
    - .ci-tools/bin/uv sync --frozen --extra dev
    - npm ci
    - npm --prefix frontend ci
    - MUSEECHO_E2E_PYTHON=.venv/bin/python npm run e2e

container-build:
  image: docker:29-cli
  stage: build
  services:
    - name: docker:29-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - production_config="$(docker compose --profile production config)"
    - case "$production_config" in *"source: /etc/museecho/secrets"*) ;; *) echo "production Secret source is not fixed" >&2; exit 1 ;; esac
    - docker build --target app --tag museecho-app:ci .
    - docker build --target gateway --tag museecho-gateway:ci .
    - test "$(docker image inspect --format '{{.Config.User}}' museecho-app:ci)" = "10001:10001"
    - test "$(docker image inspect --format '{{.Config.User}}' museecho-gateway:ci)" = "10001:10001"
    - docker save museecho-app:ci > museecho-app.tar
    - docker save museecho-gateway:ci > museecho-gateway.tar
  artifacts:
    paths: [museecho-app.tar, museecho-gateway.tar]
    expire_in: 1 day

secret-scan:
  image:
    name: mcr.microsoft.com/powershell:lts-alpine-3.20
    entrypoint: [""]
  stage: security
  before_script:
    - apk add --no-cache git
  script:
    - pwsh -NoProfile -File scripts/test-secret-scan.ps1
    - pwsh -NoProfile -File scripts/secret-scan.ps1
    - pwsh -NoProfile -File scripts/test-container-pytest.ps1

image-scan:
  image:
    name: aquasec/trivy:0.70.0
    entrypoint: [""]
  stage: security
  needs:
    - job: container-build
      artifacts: true
  script:
    - trivy image --input museecho-app.tar --exit-code 1 --severity HIGH,CRITICAL
    - trivy image --input museecho-gateway.tar --exit-code 1 --severity HIGH,CRITICAL
