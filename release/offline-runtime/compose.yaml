name: museecho-offline

services:
  app:
    image: museecho-app:local
    pull_policy: never
    environment:
      MUSEECHO_DATA_ROOT: /data
      MUSEECHO_AUDIO_KEK_FILE: /run/secrets/audio-kek
      MUSEECHO_TRUSTED_ORIGINS: ${MUSEECHO_TRUSTED_ORIGINS:-https://localhost:4173,https://127.0.0.1:4173}
    volumes:
      - museecho_data:/data
      - type: bind
        source: ${MUSEECHO_SECRETS_DIR}
        target: /run/secrets
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  gateway:
    image: museecho-gateway:local
    pull_policy: never
    environment:
      HTTPS_EXTERNAL_PORT: ${MUSEECHO_HTTPS_PORT:-4173}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MUSEECHO_HTTPS_PORT:-4173}:8443"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, wget, --no-check-certificate, --quiet, --spider, https://127.0.0.1:8443/api/health]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

volumes:
  museecho_data:
