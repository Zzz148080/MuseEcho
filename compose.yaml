name: museecho

services:
  secret-init:
    image: alpine:3.23.3
    restart: "no"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        test -f /source/audio-kek
        rm -f /prepared/audio-kek /prepared/provider-key
        cp /source/audio-kek /prepared/audio-kek
        chown 10001:10001 /prepared/audio-kek
        chmod 0400 /prepared/audio-kek
        if test -f /source/provider-key; then
          cp /source/provider-key /prepared/provider-key
          chown 10001:10001 /prepared/provider-key
          chmod 0400 /prepared/provider-key
        fi
    volumes:
      - type: bind
        source: ${MUSEECHO_SECRETS_DIR:?set MUSEECHO_SECRETS_DIR to an absolute directory outside the repository}
        target: /source
        read_only: true
      - museecho_secrets:/prepared
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  app:
    image: museecho-app:local
    build:
      context: .
      target: app
      args:
        DEBIAN_MIRROR: ${MUSEECHO_DEBIAN_MIRROR:-https://deb.debian.org/debian}
    restart: unless-stopped
    depends_on:
      secret-init:
        condition: service_completed_successfully
    environment:
      MUSEECHO_DATA_ROOT: /data
      MUSEECHO_AUDIO_KEK_FILE: /run/secrets/audio-kek
      MUSEECHO_TRUSTED_ORIGINS: ${MUSEECHO_TRUSTED_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443}
      MUSEECHO_PROVIDER_BASE_URL: ${MUSEECHO_PROVIDER_BASE_URL:-}
      MUSEECHO_PROVIDER_MODEL: ${MUSEECHO_PROVIDER_MODEL:-}
      MUSEECHO_PROVIDER_SECRET_FILE: ${MUSEECHO_PROVIDER_SECRET_FILE:-}
    volumes:
      - museecho_data:/data
      - museecho_secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  gateway:
    image: museecho-gateway:local
    build:
      context: .
      target: gateway
    restart: unless-stopped
    environment:
      HTTPS_EXTERNAL_PORT: ${MUSEECHO_HTTPS_PORT:-8443}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${MUSEECHO_HTTP_PORT:-8080}:8080"
      - "${MUSEECHO_HTTPS_PORT:-8443}:8443"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, wget, --no-check-certificate, --quiet, --spider, https://127.0.0.1:8443/api/health]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

volumes:
  museecho_data:
  museecho_secrets:
