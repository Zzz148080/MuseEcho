[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "museecho"
version = "0.1.0"
description = "MuseEcho V1 - Interactive music analysis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "httpx2>=2.7.0,<3",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
]

[tool.uv]
required-version = "==0.11.29"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "tmp/pytest-cache"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
